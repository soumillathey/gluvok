[project]
name = "hermes"
version = "0.1.0"
description = "Gluvok Weighbridge ANPR & Camera Integration Controller"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28.0",
    "pyserial>=3.5",
    "opencv-python>=4.7.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.16.4",
    "ty>=0.0.74",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

